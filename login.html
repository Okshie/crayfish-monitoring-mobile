<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#46d59a"><title>Crayfish IoT — Sign in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07110e;color:#eaf7f1;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#0c1b16;border:1px solid #1a352b;border-radius:20px;padding:24px;box-shadow:0 18px 60px #0008}.logo{font-size:2.5rem}.eyebrow{font-size:.68rem;color:#58d9a0;font-weight:900;letter-spacing:.15em;margin-top:8px}.muted{color:#8ca89e;font-size:.9rem;line-height:1.5}h1{margin:6px 0 8px;font-size:1.5rem}label{display:block;font-size:.8rem;font-weight:800;margin:16px 0 6px}input{width:100%;padding:13px;border-radius:10px;border:1px solid #29473b;background:#08130f;color:#eaf7f1;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#46d59a;color:#052016;font-weight:900;font-size:1rem}button:disabled{opacity:.6}#error{margin-top:12px;color:#ffb6aa;font-size:.85rem;min-height:1.2em}.back{display:block;text-align:center;margin-top:16px;color:#8ca89e;text-decoration:none;font-size:.82rem}
</style></head><body><main class="card"><div class="logo">🦞</div><div class="eyebrow">MOBILE MONITORING SYSTEM</div><h1>Crayfish IoT Monitoring</h1><p class="muted">Sign in to view sensor readings and control the growing system.</p>
<form id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" type="submit">Sign in</button><div id="error" role="alert"></div></form><a class="back" href="./index.html">Back to app</a></main>
<script>
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
(async()=>{const {data:{session}}=await client.auth.getSession();if(session)window.location.replace('./index.html');})();
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const errorBox=document.getElementById('error'),button=document.getElementById('loginButton');errorBox.textContent='';button.disabled=true;button.textContent='Signing in...';const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){errorBox.textContent=error.message;button.disabled=false;button.textContent='Sign in';return}window.location.replace('./index.html');});
</script></body></html>
